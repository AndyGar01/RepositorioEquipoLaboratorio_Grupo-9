<!DOCTYPE html>
<html lang="en">
        
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>VITALAB</title>
            <link rel="stylesheet" href="styleVitalab.css">
            <link rel="icon" href="icons/VitaLabCla.ico">
    </head>
        
    <body> 
        <div class="Menu">
            <img src="images/Menu.png" alt="Icono menu" width="45px">
            <img src="images/Close.png" alt="Icono menu" width="45px">
        </div>
            <div class="barra_lateral">
                <div class="titulo_menu"> 
                    <img id="Logo" src="images/VitaLabCla.png" alt="Logo de VitaLab">
                    <span>
                        <img id="LogoTexto" src="images/VitaLabTextoBla.png" alt="VitaLab con Texto" width="150px">
                    </span>
                </div>
                <br>
                <nav class="navegacion"> 
                    <ul>
                        <br>
                        <li>
                            <a href="#PrimerContenido" id="PrimerBoton">
                                <img src="images/dashboard.png" alt="logo de gmail" width="20">
                                <span> &nbsp;&nbsp;&nbsp;&nbsp;Dashboard </span>
                            </a>
                        </li>
                            
                        <li>
                            <a href="#SegundoContenido" id="SegundoBoton">
                                <img src="images/usuarios.png" alt="logo de gmail" width="20">
                                <span> &nbsp;&nbsp;&nbsp;&nbsp;Usuarios </span>
                            </a>
                        </li>
                        
                        <li>
                            <a href="#TercerContenido" id="TercerBoton">
                                <img src="images/modulos.png" alt="logo de gmail" width=10">
                                <span> &nbsp;&nbsp;&nbsp;&nbsp;Módulos </span>
                            </a>
                        </li>

                        <li>
                            <a href="#CuartoContenido" id="CuartoBoton">
                                <img src="images/perfiles.png" alt="logo de gmail" width="20">
                                <span> &nbsp;&nbsp;&nbsp;&nbsp;Perfiles </span>
                            </a>
                        </li>

                        <li>
                            <a href="#QuintoContenido" id="QuintoBoton">
                                <img src="images/permisos.png" alt="logo de gmail" width="20">
                                <span> &nbsp;&nbsp;&nbsp;&nbsp;Permisos</P> </span>
                            </a>
                        </li>

                        <li>
                            <a href="#SextaContenido" id="SextoBoton">
                                <img src="images/alumnos.png" alt="logo de gmail" width="20">
                                <span> &nbsp;&nbsp;&nbsp;&nbsp;Alumnos </span>
                            </a>
                        </li>

                        <li>
                            <a href="#SeptimaContenido" id="SeptimoBoton">
                                <img src="images/carreras.png" alt="logo de gmail" width="20">
                                <span> &nbsp;&nbsp;&nbsp;&nbsp;Carreras </span>
                            </a>
                        </li>

                        <li>
                            <a href="#SeptimaContenido" id="SeptimoBoton">
                                <img src="images/carreras.png" alt="logo de gmail" width="20">
                                <span> &nbsp;&nbsp;&nbsp;&nbsp;Carreras </span>
                            </a>
                        </li>
                        
                    </ul>
                </nav>

                                        <li>
                            <a href="#OctavaContenido" id="OctavoBoton">
                                <img src="images/equipos.png" alt="logo de gmail" width="20">
                                <span> &nbsp;&nbsp;&nbsp;&nbsp;equipos </span>
                            </a>
                        </li>
                        
                    </ul>
                </nav>

                <div class="linea"></div>

                <div class="modo_oscuro">
                    <div class="info">
                        <img src="images/Oscuro2.png" alt="Icono modo oscuro" width="25">
                        <span>&nbsp;&nbsp;&nbspDark mode</span>
                    </div>

                    <div class="switch">
                        <div class="base">
                            <div class="circulo"></div>
                        </div>
                    </div>
                </div>

                <div class="usuario">
                    <img src="images/Usuario2.png" alt="icono usuario">
                    <div class="info_usuario">
                        <div class="nombre_email">
                            <span class="nombre"> Nombre </span>
                            <span class="email"> Email </span>
                            <span class="perfil"> Perfil </span>
                        </div>
                    </div>
                </div>
                <br>
                <button class="cerrarSesion">
                    <img src="images/logout.png" alt="Cerrar Sesion" width="20px">
                    <span class="textoCerrar">Cerrar Sessión</span>
                </button>
            </div>  

        <main>

            <section id="PrimerContenido" class="PrimeraSeccion">
                <h1> VITALAB </h1>
                <p>Sección del Dashboard.</p>
            </section>

            <!--Seccion del CRUD de Usuarios-->
            <section id="SegundoContenido" class="SegundaSeccion">
                <div class="contenedor_usuario"></div>
            </section>

            <section id="TercerContenido" class="TercerSeccion">
                <div class="contenedor_modulo"></div>
            </section>

            <section id="CuartoContenido" class="CuartaSeccion">
                <div class="contenedor_perfil"></div>
            </section>

            <section id="QuintoContenido" class="QuintaSeccion">
                <div class="contenedor_perfilmodulo"></div>
            </section>

            <section id="SextaContenido" class="SextaSeccion">
                <div class="contenedor_alumno"></div>
            </section>

            <section id="SeptimaContenido" class="SeptimaSeccion">
                <div class="contenedor_carrera"></div>
            </section>
            
            <section id="OctavaContenido" class="OctavaSeccion">
                <div class="contenedor_equipos"></div>
            </section>
            <section>
                <div class="wave wave1"></div>
                <div class="wave wave2"></div>
                <div class="wave wave3"></div>
                <div class="wave wave4"></div>
            </section>  

        </main>

        <script src="scriptVitalab.js"></script>
        <script src="scriptPermisos.js"></script>

    </body>
</html>
